    <main>
        <h2>Custom Cake &amp; Order Enquiry</h2>
        <p style="text-align: center; margin-bottom: 2rem;">Fill in the form below to request a custom cake or ask about an order.</p>
        
        <!-- GOOGLE FORM INTEGRATION: Replace action URL with your Google Form action URL -->
        <form action="https://docs.google.com/forms/d/e/1FAIpQLSf_YOUR_FORM_ID_HERE/formResponse" method="POST" target="_blank">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="entry.444444444" placeholder="Enter your full name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="entry.555555555" placeholder="Enter your email" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="entry.666666666" placeholder="Enter your phone number" required>

            <label for="order-type">What are you enquiring about?</label>
            <select id="order-type" name="entry.777777777">
                <option value="Custom Cake">Custom Cake</option>
                <option value="Bulk/Event Order">Bulk/Event Order</option>
                <option value="Other">Other</option>
            </select>

            <label for="message">Message</label>
            <textarea id="message" name="entry.888888888" rows="5" placeholder="Tell us about your order..." required></textarea>

            <button type="submit">Send Enquiry</button>
        </form>
    </main>
